version: '3.8'

services:
  db:
    image: postgres:15
    container_name: babylon_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: babylon_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  indexer:
    build: .
    container_name: babylon_indexer
    depends_on:
      - db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=babylon_db
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    env_file:
      - .env

volumes:
  postgres_data: